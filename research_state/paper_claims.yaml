version: "1.0.0"
project: "Autonomous Bimanual Soft-Body Slicing (Tomato Cutting RL)"
last_updated: "2026-10-05"

claims:
  - id: "CLAIM-01"
    paper_section: "Abstract / Section VI-A"
    statement: "The proposed tactile-conditioned residual RL policy achieves a 92.0% slicing completion rate across varying tomato ripeness stages, outperforming pure kinematic and classical impedance baselines by 47.0% and 27.0% respectively."
    hypothesis_id: "H1"
    required_experiments:
      - "EXP-001-BASELINE-KINEMATIC"
      - "EXP-002-IMPEDANCE-FIXED"
      - "EXP-003-RESIDUAL-RL-TACTILE"
    metric_threshold: "slice_success_rate >= 0.90"
    statistical_test: "Mann-Whitney U test with p < 0.01 against EXP-002"
    status: "UNVERIFIED"
    target_figure: "fig:slicing_success_comparison"
    target_table: "tab:baseline_comparison"

  - id: "CLAIM-02"
    paper_section: "Section VI-B (Deformation Analysis)"
    statement: "Active impedance modulation suppresses peak normal contact force by 38.5% and prevents catastrophic tomato crushing, maintaining pre-fracture deformation below 12% of the object diameter."
    hypothesis_id: "H1"
    required_experiments:
      - "EXP-001-BASELINE-KINEMATIC"
      - "EXP-003-RESIDUAL-RL-TACTILE"
    metric_threshold: "max_deformation_ratio <= 0.15"
    statistical_test: "Welch's t-test with p < 0.001"
    status: "UNVERIFIED"
    target_figure: "fig:force_deformation_curves"
    target_table: "tab:contact_metrics"

  - id: "CLAIM-03"
    paper_section: "Section VI-C (Sample Efficiency & Ablations)"
    statement: "Superimposing residual policy actions over a nominal Cartesian sawing primitive reduces environment sample complexity by 5.2x compared to end-to-end Cartesian RL and enables stable convergence within 2.5 million environment steps."
    hypothesis_id: "H2"
    required_experiments:
      - "EXP-004-E2E-JOINT-RL"
      - "EXP-005-E2E-CARTESIAN-RL"
      - "EXP-006-RESIDUAL-PRIMITIVE-RL"
    metric_threshold: "sample_steps_to_convergence <= 3000000"
    statistical_test: "Convergence step ratio >= 4.0x across 5 seeds"
    status: "UNVERIFIED"
    target_figure: "fig:training_convergence_curves"
    target_table: "tab:ablation_study"

  - id: "CLAIM-04"
    paper_section: "Section VI-D (Sim-to-Real Transfer)"
    statement: "Domain randomization of PhysX 5 FEM material stiffness and fracture energy enables zero-shot real-world transfer onto physical dual AR5-L6 arms, achieving an 85.0% slicing success rate without real-robot policy retraining."
    hypothesis_id: "H3"
    required_experiments:
      - "EXP-007-NO-DR-TRANSFER"
      - "EXP-008-FULL-DR-TRANSFER"
    metric_threshold: "zero_shot_real_success >= 0.80"
    statistical_test: "Binomial proportion test against baseline"
    status: "UNVERIFIED"
    target_figure: "fig:real_world_cutting_montage"
    target_table: "tab:sim_to_real_benchmark"
