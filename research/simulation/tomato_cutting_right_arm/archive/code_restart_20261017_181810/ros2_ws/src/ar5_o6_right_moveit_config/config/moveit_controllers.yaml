moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - hand_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - AR5_5_07R_W4C4A2_joint_1
      - AR5_5_07R_W4C4A2_joint_2
      - AR5_5_07R_W4C4A2_joint_3
      - AR5_5_07R_W4C4A2_joint_4
      - AR5_5_07R_W4C4A2_joint_5
      - AR5_5_07R_W4C4A2_joint_6
      - AR5_5_07R_W4C4A2_joint_7

  hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - rh_thumb_cmc_yaw
      - rh_thumb_cmc_pitch
      - rh_index_mcp_pitch
      - rh_middle_mcp_pitch
      - rh_ring_mcp_pitch
      - rh_pinky_mcp_pitch
